<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claudio Ortega Núñez</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #ffffff;
    --card-bg-2: #f4f5f7;
    --text: #14161a;
    --text-dim: #5b6068;
    --accent: #1f8f4e;
    --accent-2: #25d366;
    --border: #e4e6ea;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0c0f;
      --card-bg: #1a1c22;
      --card-bg-2: #22242b;
      --text: #f2f3f5;
      --text-dim: #a3a8b1;
      --border: #2c2f37;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0c0f;
    --card-bg: #1a1c22;
    --card-bg-2: #22242b;
    --text: #f2f3f5;
    --text-dim: #a3a8b1;
    --border: #2c2f37;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }

  .avatar {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    margin: 0 auto 18px;
  }

  h1 {
    font-size: 21px;
    margin: 0 0 4px;
    font-weight: 700;
  }

  .role {
    font-size: 14.5px;
    color: var(--text-dim);
    margin: 0 0 2px;
    line-height: 1.4;
  }

  .company {
    font-size: 14.5px;
    color: var(--text-dim);
    margin: 0 0 20px;
    font-weight: 600;
  }

  .info {
    background: var(--card-bg-2);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 22px;
    text-align: left;
  }

  .info-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    padding: 5px 0;
    color: var(--text);
    word-break: break-all;
  }

  .info-row .icon {
    flex-shrink: 0;
    width: 18px;
    text-align: center;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    margin-bottom: 12px;
    transition: transform 0.05s ease;
  }
  .btn:active { transform: scale(0.98); }

  .btn-save {
    background: #14161a;
    color: #ffffff;
    border: 1px solid rgba(255,255,255,0.08);
  }

  .btn-whatsapp {
    background: var(--accent-2);
    color: #ffffff;
  }

  .hint {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="avatar">CO</div>
    <h1>Claudio Ortega Núñez</h1>
    <p class="role">Subgerente Sales Support</p>
    <p class="company">Soltex Chile S.A.</p>

    <div class="info">
      <div class="info-row"><span class="icon">📱</span><span>+56 9 9128 0797</span></div>
      <div class="info-row"><span class="icon">✉️</span><span>cortega@soltex.cl</span></div>
    </div>

    <a id="saveBtn" class="btn btn-save" href="#">
      💾 Guardar contacto
    </a>

    <a id="waBtn" class="btn btn-whatsapp" href="#" target="_blank" rel="noopener">
      💬 Escribirme por WhatsApp
    </a>

    <p class="hint">Al tocar "Guardar contacto" tu teléfono te ofrecerá agregarlo directamente a tus contactos.</p>
  </div>

<script>
  const vcard = [
    "BEGIN:VCARD",
    "VERSION:3.0",
    "N:Ortega Nuñez;Claudio;;;",
    "FN:Claudio Ortega Nuñez",
    "ORG:Soltex Chile S.A.",
    "TITLE:Subgerente Sales Support",
    "TEL;TYPE=CELL,VOICE:+56991280797",
    "EMAIL;TYPE=INTERNET,WORK:cortega@soltex.cl",
    "END:VCARD"
  ].join("\r\n");

  const vcardUri = "data:text/vcard;charset=utf-8," + encodeURIComponent(vcard);
  document.getElementById("saveBtn").setAttribute("href", vcardUri);

  const phoneDigits = "56991280797";
  document.getElementById("waBtn").setAttribute("href", "https://wa.me/" + phoneDigits);
</script>

</body>
</html>
